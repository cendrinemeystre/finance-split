<div class="container-fluid" [ngClass]="isMobile() ? '' : 'row'">
  @if (isMobile()) {
    <fs-stats class="pe-1"></fs-stats>
    <fs-split class="pe-1"></fs-split>
    <fs-finance></fs-finance>
  } @else {
    <div class="col-6">
      <fs-finance></fs-finance>
    </div>
    <div class="col-6">
      <fs-stats class="pe-1"></fs-stats>
      <fs-split></fs-split>
    </div>
  }
</div>
