<div class="container-fluid row">
  <div class="col-6">
    <div class="card">
      <div class="card-header">
        <h1 class="modal-title">Finance</h1>
      </div>
      <div class="card-body">
        @if (splitEntry.length > 0) {
          <table class="table table-responsive overflow-scroll">
            <thead>
            <tr>
              <th>Date</th>
              <th>Amount</th>
              <th>Description</th>
            </tr>
            </thead>
            <tbody>
              @for (entry of splitEntry; track $index) {
                <tr>
                  <td>{{ entry.date }}</td>
                  <td>{{ entry.amount }}</td>
                  <td>{{ entry.description }}</td>
                </tr>
              }
            </tbody>
          </table>
        } @else {
          <p class="card-text">No Entries</p>
        }
      </div>
    </div>
  </div>
  <div class="col-6">
    <div class="card">
      <div class="card-header d-flex justify-content-between"
           [ngClass]="splitEntryForm.cendrine().value() ? 'card-background__c': 'card-background__p'">
        <h1 class="modal-title">Split</h1>
        <label for="cendrine" class="me-2 pt-3 form-label align-self-center">
          Cendrine:
          <mat-slide-toggle class="mat-mdc-slide-toggle mat-accent" [formField]="splitEntryForm.cendrine">
          </mat-slide-toggle>
        </label>
      </div>
      <div class="card-body d-flex">
        <label for="amount" class="me-2 form-label">
          Amount:
          <input type="number" class="form-control" [formField]="splitEntryForm.amount">
          @for (error of this.splitEntryForm.amount().errors(); track error) {
            <p class="text-danger-emphasis">{{ error.message }}</p>
          }
        </label>
        <label for="description" class="me-2 form-label flex-fill">
          Description:
          <input class="form-control" type="text" [formField]="splitEntryForm.description">
        </label>
      </div>
      <div class="card-footer text-end">
        <button class="btn btn-success" [disabled]="splitEntryForm.amount().invalid()">Save</button>
      </div>
    </div>
  </div>
</div>
