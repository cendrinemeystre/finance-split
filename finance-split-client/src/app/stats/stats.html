<div class="card">
  <div class="card-header d-flex justify-content-between">
    <h1 class="modal-title">Stats</h1>
    <img src="assets/images/ibby.jpeg" height="60" width="55" alt="ibby"/>
    <mat-slide-toggle class="pt-3 form-label align-self-center mat-mdc-slide-toggle mat-accent"
                      (change)="toggle()">
    </mat-slide-toggle>
  </div>
  <div class="card-body">
    <div class="row">
      <label>
        Total:
        <input type="text" class="form-control" [disabled]="true" [value]="personStore.totalSum()">
      </label>
    </div>
    <div class="row d-flex">
      @for (person of personStore.persons(); track person.id) {
        <label class="col-6 flex-fill">
          {{ person.name }}:
          <input type="text" class="form-control" [disabled]="true" [value]="person.total">
        </label>
      }
    </div>
  </div>
</div>
