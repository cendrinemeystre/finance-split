<div class="card">
  <div class="card-header d-flex justify-content-between"
       [ngClass]="splitEntryForm.person().value() ? 'card-gradient': 'card-rainbow'">
    <h1 class="modal-title">Split: {{ splitEntryForm.person().value() ? 'Cendrine' : 'Patrick' }}</h1>
    <mat-slide-toggle class="pt-3 form-label align-self-center mat-mdc-slide-toggle mat-accent"
                      [formField]="splitEntryForm.person">
    </mat-slide-toggle>
  </div>
  <div class="card-body d-flex">
    <label for="amount" class="me-2 form-label">
      Amount:
      <input type="number" class="form-control" [formField]="splitEntryForm.amount">
      @for (error of this.splitEntryForm.amount().errors(); track error) {
        <p class="text-danger-emphasis">{{ error.message }}</p>
      }
    </label>
    <label for="description" class="me-2 form-label flex-fill">
      Description:
      <input class="form-control" type="text" [formField]="splitEntryForm.description">
    </label>
  </div>
  <div class="card-footer text-end">
    <button class="btn btn-success" [disabled]="splitEntryForm.amount().invalid()" (click)="add()">Save</button>
  </div>
</div>
